function updateDateTime() {
    const now = new Date();
    const formattedDate = now.toISOString().split('T')[0]; // Get YYYY-MM-DD
    const formattedTime = now.toLocaleTimeString(); // Keep time as is
    currentDateElement.innerText = `Date: ${formattedDate} Time: ${formattedTime}`;
}
setInterval(updateDateTime, 1000);
function getGrade(score) {
  if (score >= 75) return 'A';
  if (score >= 65) return 'B';
  if (score >= 55) return 'C';
  if (score >= 35) return 'S';
  return 'W';
}
function updateSummary() {
  const selectedClass = classSelect.value;
  const totalStudents = students[selectedClass].length;
  let presentCount = 0;
  students[selectedClass].forEach(student => {
    if (localStorage.getItem(`${selectedClass}-${student.register}`)) {
      presentCount++;
    }
  });
  const absentCount = totalStudents - presentCount;
  const summaryText = `Total Students: ${totalStudents} | Present: ${presentCount} | Absent: ${absentCount}`;
  summaryElement.textContent = summaryText;
  summaryBelowElement.textContent = summaryText;
  teacherNameElement.textContent = `Class Teacher: ${teachers[selectedClass].name}`;
  const teacherPhoto = document.getElementById("teacher-photo");
    teacherPhoto.src = teacherPhotos[selectedClass];
    teacherPhoto.style.display = "block"; // Show the photo
}



function loadStudents() {
  const selectedClass = classSelect.value;
  attendanceTable.innerHTML = '';
  students[selectedClass].forEach(student => {
    const row = attendanceTable.insertRow();
    const markCell = row.insertCell(0);
    const registerCell = row.insertCell(1);
    const nameCell = row.insertCell(2);
    const timeCell = row.insertCell(3);
    const marksCell = row.insertCell(4);
    const checkbox = document.createElement('div');
    checkbox.className = 'custom-checkbox';
    const isChecked = localStorage.getItem(`${selectedClass}-${student.register}`);
    if (isChecked) {
      checkbox.classList.add('checked');
      timeCell.textContent = isChecked;
    }
    checkbox.addEventListener('click', function () {
      checkbox.classList.toggle('checked');
      const isChecked = checkbox.classList.contains('checked');
      if (isChecked) {
        const time = new Date().toLocaleTimeString();
        timeCell.textContent = time;
        localStorage.setItem(`${selectedClass}-${student.register}`, time);
      } else {
        timeCell.textContent = '';
        localStorage.removeItem(`${selectedClass}-${student.register}`);
      }
      updateSummary();
    });
    markCell.appendChild(checkbox);
    registerCell.textContent = student.register;
    nameCell.textContent = student.name;
    const marksInput = document.createElement('input');
    marksInput.type = 'number';
    marksInput.style.display = 'none';
    marksInput.dataset.register = student.register;
    marksInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const nextInput = marksInput.parentElement.parentElement.nextElementSibling?.querySelector('input[type="number"]');
        if (nextInput) {
          nextInput.focus();
        }
      }
    });
    marksCell.appendChild(marksInput);
  });
  updateSummary();
}
document.getElementById('clear-data').addEventListener('click', () => {
  const selectedClass = classSelect.value;
  students[selectedClass].forEach(student => {
    localStorage.removeItem(`${selectedClass}-${student.register}`);
  });
  loadStudents();
});
document.getElementById('get-report').addEventListener('click', () => {
  const selectedClass = classSelect.value;
  const doc = new jsPDF();
  doc.setFontSize(12);
  doc.text(`Attendance Report - Class ${selectedClass}`, 15, 15);

  const teacher = classTeachers[selectedClass]; // Reference classTeachers for teacher details
  const teacherImageUrl = teacherPhotos[selectedClass]; // Reference teacherPhotos for photo URL

  // Function to generate the PDF content
  const generatePDF = () => {
    doc.text(`Date: ${new Date().toLocaleDateString()}`, 15, 25);
    doc.text(`Class Teacher: ${teacher.name}`, 195.5, 40, null, null, 'right');

    let tableData = [];
    const totalStudents = students[selectedClass].length;
    let presentCount = 0;

    students[selectedClass].forEach(student => {
      const isPresent = localStorage.getItem(`${selectedClass}-${student.register}`);
      const status = isPresent ? `Present` : 'Absent';
      tableData.push({
        register: student.register,
        name: student.name,
        status: status,
        rowColor: isPresent ? [204, 255, 204] : [255, 204, 204] // Green for present, Red for absent
      });
      if (isPresent) {
        presentCount++;
      }
    });

    const absentCount = totalStudents - presentCount;
    doc.text(`Total Students: ${totalStudents} Present: ${presentCount} Absent: ${absentCount}`, 15, 35);

    const columns = [
      { header: 'Register Number', dataKey: 'register' },
      { header: 'Name', dataKey: 'name' },
      { header: 'Attendance Status', dataKey: 'status' }
    ];

    doc.autoTable({
      columns: columns,
      body: tableData,
      startY: 44,
      theme: 'grid',
      margin: { top: 30 },
      styles: { fontSize: 10 },
      headStyles: {
        fillColor: [0, 0, 0],
        textColor: [0, 0, 0],
        fontStyle: 'bold'
      },
      didParseCell: (data) => {
        if (data.section === 'head') {
          data.cell.styles.fillColor = [255, 230, 66]; // Light yellow
        } else if (data.section === 'body') {
          const rowData = tableData[data.row.index];
          if (rowData && rowData.rowColor) {
            data.cell.styles.fillColor = rowData.rowColor;
          }
        }
      },
      didDrawPage: (data) => {
        doc.setFontSize(10);
        doc.text(`Page ${data.pageCount}`, doc.internal.pageSize.getWidth() - 30, doc.internal.pageSize.getHeight() - 10);
      }
    });

    doc.save(`Attendance_${selectedClass}_${new Date().toLocaleDateString()}.pdf`);
  };

  // Check if there’s a valid teacher image URL
  if (teacherImageUrl) {
    const img = new Image();
    img.src = teacherImageUrl;
    img.onload = () => {
      doc.addImage(img, 'JPEG', 160, 4, 28, 31); // Add image if it loads successfully
      generatePDF();
    };
    img.onerror = () => {
      console.warn('Teacher image failed to load, generating PDF without image.');
      generatePDF(); // Proceed without the image
    };
  } else {
    generatePDF(); // No image URL, proceed directly to PDF generation
  }
});

document.getElementById('absent-report').addEventListener('click', () => {
  const selectedClass = classSelect.value;

  doc.text(`Absent Report - Class ${selectedClass}`, 10, 10);

  let tableData = [];
  const totalStudents = students[selectedClass].length;
  let presentCount = 0;
  students[selectedClass].forEach(student => {
    const isPresent = localStorage.getItem(`${selectedClass}-${student.register}`);
    if (!isPresent) {
      tableData.push([student.register, student.name]);
    } else {
      presentCount++;
    }
  });
  const absentCount = totalStudents - presentCount;
  doc.text(`Total Students: ${totalStudents} Present: ${presentCount} Absent: ${absentCount}`, 10, 30);

    { header: 'Register Number', dataKey: 0 },

    columns: columns,
    body: tableData,
    startY: 35,
    theme: 'grid',

      doc.setFontSize(10);
      doc.text(`Page ${data.pageCount}`, doc.internal.pageSize.getWidth() - 30, doc.internal.pageSize.getHeight() - 10);
    }
  });

});

    let presentCount = 0;
    students[selectedClass].forEach(student => {
      const isPresent = localStorage.getItem(`${selectedClass}-${student.register}`);
      const status = isPresent ? isPresent : 'Absent';
      const marksInput = document.querySelector(`input[data-register="${student.register}"]`);
      const marks = marksInput.value || 'N/A';
      const grade = getGrade(parseInt(marks, 10));
      tableData.push([student.register, student.name, status, marks, grade]);
      if (isPresent) {
        presentCount++;
      }
    });
    const absentCount = totalStudents - presentCount;
    doc.text(`Total Students: ${totalStudents} Present: ${presentCount} Absent: ${absentCount}`, 10, 30);
    doc.autoTable({
      head: [['Register Number', 'Name', 'Attendance Status', 'Marks', 'Grade']],
      body: tableData,
      startY: 35,
      theme: 'grid',
      margin: { top: 30 },
      didDrawPage: (data) => {
        doc.setFontSize(10);
        doc.text(`Page ${data.pageCount}`, doc.internal.pageSize.getWidth() - 30, doc.internal.pageSize.getHeight() - 10);
      }
    });
    doc.save(`Marks_${selectedClass}_${new Date().toLocaleDateString()}.pdf`);

    marksColumn.style.display = 'none';
    subjectContainer.style.display = 'none';
    document.querySelectorAll('input[type="number"]').forEach(input => {
      input.style.display = 'none';
    });
  }
});
