function updateDateTime() {
    const now = new Date();
    const formattedDate = now.toISOString().split('T')[0];
    const formattedTime = now.toLocaleTimeString();
    currentDateElement.innerText = `Date: ${formattedDate} Time: ${formattedTime}`;
}
setInterval(updateDateTime, 1000);

function getGrade(score) {
    if (score >= 75) return 'A';
    if (score >= 65) return 'B';
    if (score >= 55) return 'C';
    if (score >= 35) return 'S';
    return 'W';
}

function updateSummary() {
    const totalStudents = students["9A's Squad"].length;
    let presentCount = 0;
    students["9A's Squad"].forEach(student => {
        if (localStorage.getItem(`9A's Squad-${student.register}`)) {
            presentCount++;
        }
    });
    const absentCount = totalStudents - presentCount;
    const summaryText = `Total Students: ${totalStudents} | Present: ${presentCount} | Absent: ${absentCount}`;
    summaryElement.textContent = summaryText;
    summaryBelowElement.textContent = summaryText;
    teacherNameElement.textContent = `Class Teacher: ${teacher.name}`;
    const teacherPhoto = document.getElementById("teacher-photo");
    teacherPhoto.src = teacher.photoUrl;
    teacherPhoto.style.display = "block";
}

function loadStudents() {
    attendanceTable.innerHTML = '';
    students["9A's Squad"].forEach(student => {
        const row = attendanceTable.insertRow();
        const markCell = row.insertCell(0);
        const registerCell = row.insertCell(1);
        const nameCell = row.insertCell(2);
        const timeCell = row.insertCell(3);
        const marksCell = row.insertCell(4);
        const checkbox = document.createElement('div');
        checkbox.className = 'custom-checkbox';
        const isChecked = localStorage.getItem(`9A's Squad-${student.register}`);
        if (isChecked) {
            checkbox.classList.add('checked');
            timeCell.textContent = isChecked;
        }
        checkbox.addEventListener('click', function () {
            checkbox.classList.toggle('checked');
            const isChecked = checkbox.classList.contains('checked');
            if (isChecked) {
                const time = new Date().toLocaleTimeString();
                timeCell.textContent = time;
                localStorage.setItem(`9A's Squad-${student.register}`, time);
            } else {
                timeCell.textContent = '';
                localStorage.removeItem(`9A's Squad-${student.register}`);
            }
            updateSummary();
        });
        markCell.appendChild(checkbox);
        registerCell.textContent = student.register;
        nameCell.textContent = student.name;
        const marksInput = document.createElement('input');
        marksInput.type = 'number';
        marksInput.style.display = 'none';
        marksInput.dataset.register = student.register;
        marksInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const nextInput = marksInput.parentElement.parentElement.nextElementSibling?.querySelector('input[type="number"]');
                if (nextInput) {
                    nextInput.focus();
                }
            }
        });
        marksCell.appendChild(marksInput);
    });
    updateSummary();
}

document.getElementById('get-report').addEventListener('click', () => {
    const doc = new jsPDF();
    doc.setFontSize(12);
    doc.text(`Attendance Report - Class 9A's Squad`, 15, 15);

    const img = new Image();
    img.src = teacher.photoUrl;
    img.onload = () => {
        doc.addImage(img, 'JPEG', 160, 4, 28, 31);

        doc.text(`Date: ${new Date().toLocaleDateString()}`, 15, 25);
        doc.text(`Class Teacher: ${teacher.name}`, 195.5, 40, null, null, 'right');

        let tableData = [];
        const totalStudents = students["9A's Squad"].length;
        let presentCount = 0;

        students["9A's Squad"].forEach(student => {
            const isPresent = localStorage.getItem(`9A's Squad-${student.register}`);
            const status = isPresent ? `Present` : 'Absent';
            tableData.push({
                register: student.register,
                name: student.name,
                status: status,
                rowColor: isPresent ? [204, 255, 204] : [255, 204, 204]
            });
            if (isPresent) {
                presentCount++;
            }
        });

        const absentCount = totalStudents - presentCount;
        doc.text(`Total Students: ${totalStudents} Present: ${presentCount} Absent: ${absentCount}`, 15, 35);

        const columns = [
            { header: 'Register Number', dataKey: 'register' },
            { header: 'Name', dataKey: 'name' },
            { header: 'Attendance Status', dataKey: 'status' }
        ];

        doc.autoTable({
            columns: columns,
            body: tableData,
            startY: 44,
            theme: 'grid',
            margin: { top: 30 },
            styles: { fontSize: 8 },
            headStyles: {
                fillColor: [0, 0, 0],
                textColor: [0, 0, 0],

    doc.text(`Teacher: ${teacher.name}`, 200, 20, null, null, 'right');
    let tableData = [];
    const totalStudents = students["9A's Squad"].length;
    let presentCount = 0;
    students["9A's Squad"].forEach(student => {
        const isPresent = localStorage.getItem(`9A's Squad-${student.register}`);
        if (!isPresent) {
            tableData.push([student.register, student.name]);
        } else {
            presentCount++;
        }
    });
    const absentCount = totalStudents - presentCount;
    doc.text(`Total Students: ${totalStudents} Present: ${presentCount} Absent: ${absentCount}`, 10, 30);
    const columns = [
        { header: 'Register Number', dataKey: 0 },
        { header: 'Name', dataKey: 1 }
    ];

        body: tableData,
        startY: 35,
        theme: 'grid',
        margin: { top: 30 },
        styles: { fontSize: 8 },

            doc.setFontSize(10);
            doc.text(`Page ${data.pageCount}`, doc.internal.pageSize.getWidth() - 30, doc.internal.pageSize.getHeight() - 10);

function getGrade(score) {
    if (score >= 75) return 'A';
    if (score >= 65) return 'B';
    if (score >= 55) return 'C';
    if (score >= 35) return 'S';
    return 'W';
}

    const totalStudents = students["9A's Squad"].length;
    let presentCount = 0;
    students["9A's Squad"].forEach(student => {
        if (localStorage.getItem(`9A's Squad-${student.register}`)) {
            presentCount++;
        }
    });
    const absentCount = totalStudents - presentCount;
    const summaryText = `Total Students: ${totalStudents} | Present: ${presentCount} | Absent: ${absentCount}`;

    summaryBelowElement.textContent = summaryText;

            checkbox.classList.add('checked');
            timeCell.textContent = isChecked;

            checkbox.classList.toggle('checked');

                timeCell.textContent = time;
                localStorage.setItem(`9A's Squad-${student.register}`, time);
            } else {
                timeCell.textContent = '';
                localStorage.removeItem(`9A's Squad-${student.register}`);
            }
            updateSummary();
        });
        markCell.appendChild(checkbox);
        registerCell.textContent = student.register;
        nameCell.textContent = student.name;
        const marksInput = document.createElement('input');
        marksInput.type = 'number';
        marksInput.style.display = 'none';
        marksInput.dataset.register = student.register;
        marksInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const nextInput = marksInput.parentElement.parentElement.nextElementSibling?.querySelector('input[type="number"]');
                if (nextInput) {
                    nextInput.focus();
                }
            }
        });
        marksCell.appendChild(marksInput);
    });
    updateSummary();
}

document.getElementById('get-report').addEventListener('click', () => {
    const doc = new jsPDF();
    doc.setFontSize(12);
    doc.text(`Attendance Report - Class 9A's Squad`, 15, 15);

    const img = new Image();
    img.src = teacher.photoUrl;
    img.onload = () => {
        doc.addImage(img, 'JPEG', 160, 4, 28, 31);

        doc.text(`Date: ${new Date().toLocaleDateString()}`, 15, 25);
        doc.text(`Class Teacher: ${teacher.name}`, 195.5, 40, null, null, 'right');

        let tableData = [];
        const totalStudents = students["9A's Squad"].length;
        let presentCount = 0;

        students["9A's Squad"].forEach(student => {
            const isPresent = localStorage.getItem(`9A's Squad-${student.register}`);
            const status = isPresent ? `Present` : 'Absent';
            tableData.push({
                register: student.register,
                name: student.name,
                status: status,
                rowColor: isPresent ? [204, 255, 204] : [255, 204, 204]
            });
            if (isPresent) {
                presentCount++;
            }
        });

        const absentCount = totalStudents - presentCount;
        doc.text(`Total Students: ${totalStudents} Present: ${presentCount} Absent: ${absentCount}`, 15, 35);

        const columns = [
            { header: 'Register Number', dataKey: 'register' },
            { header: 'Name', dataKey: 'name' },
            { header: 'Attendance Status', dataKey: 'status' }
        ];

        doc.autoTable({
            columns: columns,
            body: tableData,
            startY: 44,
            theme: 'grid',
            margin: { top: 30 },
            styles: { fontSize: 8 },
            headStyles: {
                fillColor: [0, 0, 0],
                textColor: [0, 0, 0],
                fontStyle: 'bold'
            },
            didParseCell: (data) => {
                if (data.section === 'head') {
                    data.cell.styles.fillColor = [255, 230, 66];
                } else if (data.section === 'body') {
                    const rowData = tableData[data.row.index];
                    if (rowData && rowData.rowColor) {
                        data.cell.styles.fillColor = rowData.rowColor;
                    }
                }
            },
            didDrawPage: (data) => {
                doc.setFontSize(10);
                doc.text(`Page ${data.pageCount}`, doc.internal.pageSize.getWidth() - 30, doc.internal.pageSize.getHeight() - 10);
            }
        });

        doc.save(`Attendance_9As_Squad_${new Date().toLocaleDateString()}.pdf`);
    };
});

});
